<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Strudel, no build step. One script tag. Pinned; bump the version freely. -->
  <script src="https://unpkg.com/@strudel/web@1.0.3"></script>

  <style>
    :root { --bg:#0a0d08; --stone:#8b8680; --moss:#4a7c59; --amber:#d4a843; --rust:#8b4a2a; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--stone);
      font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      display:flex; flex-direction:column; gap:1rem; padding:clamp(1rem,4vw,3rem); line-height:1.5;
    }
    header h1 { color:var(--amber); font-size:1.35rem; margin:0 0 .25rem; font-weight:600; }
    header p  { margin:0; font-size:.82rem; opacity:.72; }
    #code {
      width:100%; min-height:30vh; resize:vertical; opacity:.85;
      background:#070a06; color:#cdbb8f; border:1px solid #23281c; border-radius:6px;
      font:inherit; font-size:.9rem; padding:1rem; tab-size:2; line-height:1.65;
      caret-color:var(--amber); white-space:pre; overflow-wrap:normal; overflow-x:auto;
    }
    #code:focus { outline:none; border-color:var(--moss); }
    .controls { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
    button {
      background:transparent; color:var(--amber); border:1px solid var(--amber);
      font:inherit; font-size:.9rem; padding:.5rem 1.1rem; border-radius:4px; cursor:pointer;
    }
    button:hover { background:var(--amber); color:var(--bg); }
    button:disabled { opacity:.35; cursor:default; }
    button:disabled:hover { background:transparent; color:var(--amber); }
    button.stop { color:var(--rust); border-color:var(--rust); }
    button.stop:hover { background:var(--rust); color:var(--bg); }
    #status { font-size:.82rem; opacity:.8; margin-left:.4rem; }
    #status.err { color:var(--rust); opacity:1; }
    #arrstrip { display:flex; gap:2px; height:14px; }
    #arrstrip .sec { background:#141a10; border:1px solid #23281c; border-radius:2px; min-width:4px; }
    #arrstrip .sec.active { background:var(--moss); border-color:var(--amber); }
    #arrpos { font-size:.78rem; opacity:.75; min-height:1.2em; color:var(--amber); }
    #filmword { align-self:center; text-align:center; color:var(--amber); font-weight:600;
      font-size:clamp(1.3rem, 4.2vw, 2.1rem); letter-spacing:.02em;
      line-height:1.15; min-height:1.2em; max-width:92%; text-wrap:balance; }
    #filmsub { align-self:center; text-align:center; color:var(--stone); opacity:.7;
      font-size:.9rem; letter-spacing:.03em; min-height:1.2em; max-width:80%;
      margin-top:-.15rem; text-wrap:balance; }
    /* the STAGE: the visualizer is the full-width BACK WALL (always running); the 9/16 videos
       appear OVER it, centered. Only videos take the drop-bounce (--punch) — the sea never jumps. */
    #srcfilm { position:relative; width:100%; height:64vh; }
    #srcfilm #viz { position:absolute; inset:0; width:100%; height:100%;
      background:var(--bg); border:0; opacity:0; transition:opacity .4s; }
    #srcfilm #viz.live { opacity:1; }
    #srcfilm video { position:absolute; top:0; height:100%; left:50%; translate:-50% 0;
      aspect-ratio:9/16; max-width:100%; object-fit:contain; background:#000;
      border:1px solid #23281c; border-radius:6px; transform:scale(var(--punch,1));
      opacity:0; transition:opacity .15s, border-color .15s; }
    #srcfilm video.dim  { opacity:.12; }
    #srcfilm video.live { opacity:1; border-color:var(--amber); }
    /* the spoken words, typewritten word by word as they are said — bold amber, like the title,
       but in the story font (the human layer) */
    #lyric { align-self:center; text-align:center; max-width:64ch; min-height:2.8em;
      font-family:"Libre Baskerville", Georgia, "Times New Roman", serif;
      font-size:1.05rem; font-weight:700; line-height:1.45; color:var(--amber);
      text-wrap:balance; }
    kbd { border:1px solid #333; border-radius:3px; padding:0 .35em; font-size:.8em; }
  </style>
</head>
<body>

  <header>
    <h1>cyBorge · song</h1>
    <p>edit the score, or tell cyBorge what to change. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> plays ·

  <div id="srcfilm" hidden><canvas id="viz" width="1280" height="720"></canvas></div>

  <div id="arrpos"></div>

  <script>
    const editor = document.getElementById('code');
    const statusEl = document.getElementById('status');
    const setStatus = (m, err=false) => { statusEl.textContent = m; statusEl.classList.toggle('err', err); };

    // Voice clips + ONE shared cache-buster (used for BOTH sample registration and the preload).
    // VOICE-FILES-START
    const VOICE_FILES = ['line-01.wav', 'line-02.wav', 'line-03.wav', 'line-04.wav', 'line-05.wav', 'line-06.wav', 'line-07.wav', 'line-08.wav', 'line-09.wav', 'line-10.wav', 'line-11.wav', 'line-12.wav', 'line-13.wav', 'line-14.wav', 'line-15.wav', 'line-16.wav', 'line-17.wav', 'line-18.wav', 'line-19.wav', 'line-20.wav', 'line-21.wav', 'line-22.wav', 'line-23.wav', 'line-24.wav', 'line-25.wav', 'line-26.wav', 'line-27.wav', 'line-28.wav', 'line-29.wav', 'line-30.wav', 'line-31.wav', 'line-32.wav', 'line-33.wav', 'line-34.wav', 'line-35.wav', 'line-36.wav', 'line-37.wav', 'line-38.wav', 'line-39.wav', 'line-40.wav', 'line-41.wav', 'line-42.wav', 'line-43.wav', 'line-44.wav', 'line-45.wav', 'line-46.wav', 'line-47.wav', 'line-48.wav'];
    const VOICE_TEXTS = ["Even the earth bleeds. Oh dear, oh dear. It bleeds stone, red and warm.", "The wound scars over, and an ugly black mess now stands in the middle of nowhere. The middle of fucking nowhere I say. Then all the other stuff happens, fish out the ocean. Meteors. Mammals everywhere, religions everywhere.", "Oh dear, what year?", "Somewhere in 1510, Goa (west India) is beset by the Portuguese — in particular by one Afonso de Albuquerque, a busybody. He has a man, Lopes. Goa conquered, Afonso is off to Malacca in Malaysia, but first he says to Lopes: \"Goa is yours, rule it well.\"", "Lopes decides to follow the advice, and rules it with love. He and a Muslim girl are to be married, and so Lopes converts to Islam. Afonso returns, two years hence, and considers this treason: Lopes and his men are 'renegades' now, Portuguese gone Muslim for love. They are surrendered on the condition that they be left alive. Most are promptly tortured to death.", "Lopes is the leader, his torture is the most severe. It goes like this. Things scraped off with clam shells: Hair, Beard. Things severed (in a public square): Nose, Ears, Left thumb, Right Arm.", "By all accounts, he is no longer all right.", "Here is what he looks like afterwards:", "Lopes decides to seek a new employer, and takes to sailing. On a trip around Africa (for spices, read a book). The ship he sails on stops for fresh water on a remote Island called Saint Helena (discovered only a few years before).", "Lopes, oh dear, no ear, decides people ain't shit, and sneaks off the ship where he is marooned, man alone. He would be the Island's first exile — albeit a self-imposed one.", "Later, this is said of him: \"The crew was amazed when they saw the grotto and the straw bed on which he slept...and when they saw the clothing they agreed it must be a Portuguese man. So they took in their water and did not meddle with anything, but left biscuits and cheeses and things to eat and a letter telling him not to hide himself the next time a ship came to the island for no one would harm him.", "Then the ship set off, and as she was spreading her sails a cockerel fell overboard and the waves carried it to the shore and Lopes caught it and fed it with some rice which they had left behind for him.\"", "Lopes and the cockerel become fast friends. It roosts above his head, and comes if called. Years pass and Lopes starts to lose his fear of man. An unfortunate decision that leads to him being persuaded to return home to Portugal. After a short stint in Portugal, he goes to Rome, and sees the pope (who forgives him for apostasy). The pope, impressed by the maimed man's story, asks if he can grant him a wish. Lopes wishes to return to Saint Helena.", "A letter is sent to King João the Third and Lopes returns to his true home, where he lives, in peace, for another twenty years in almost complete solitude. He is the first of \"God's own People\" from Saint Helena.", "Saint Helena passes hands like a coin: Portuguese, English East India, Dutch East India, English again. She is important now — an island for rewatering ships, worth fighting over. It is only England's second ever overseas territory. A precedent is set.", "Oh dear oh dear. England goes to war against the first modern European. An emperor mind you. Napoleon.", "The ships come in droves now. They rewater where the cripple Lopes roamed with his cockerel. A settlement follows and forts rise there. Slaves are needed, and soon there are thousands. Souls are worked to death (approximately nine thousand skeletons are found later), then slavery is abolished when the work is done.", "The island breathes and the bones settle.", "By now, Napoleon has escaped from Elba. He decides to conquer just a little more and does Waterloo. Napoleon is defeated, but surrenders in hope of asylum… instead he is exiled to a remote island in the middle of nowhere, the middle of fucking nowhere he'll tell you. Saint Helena.", "He gardens, and wrestles the neighbour-kid for fun. He hates the place and is not allowed any gifts. The royal navy has ringed the island with ships. His dying words are of Josephine, and being buried next to the Seine. Instead he is buried in Saint Helena and after an argument, his tombstone is unnamed.", "Oh dear, an emperor lies here.", "Slave trade is abolished and now seriously illegal. Britain sees to it that slave ships are lightened of all slaves. But Africa, so far away, seems like too much effort. Rescued slaves, instead, are sent to Saint Helena. About fifteen thousand slaves land there and are sent on to either the Caribbean or homewards. Many though, lend their bones, as God's people, to that there scar over the sea.  Oh dear.", "England, now adept at sending prisoners to islands (see Australia), has conquered the Zulus. A man named Dinuzulu, prince of the Zulus, surrenders after a long battle and is exiled for seven years. Oh dear, a prince now too!", "Dinuzulu arrives with singers and wives. They sing at night and the amahubo rattles the teacups of the British. The island listens well and thrums with harmonies; and notes fall within the stones and bones.", "The gentlemen poets of the island join in, and in turn Dinuzulu learns piano and reading and writing. The zulu become popular among the locals (the prince in particular) and Dinuzulu has eight children there on that broken rock and has to leave two wives behind to its graveyard when he leaves after exile.", "The English describe him as “no longer a savage” because that part of him too, is marked for God’s people. That part of him is with his wives. Oh dears.", "More prisoners arrive, from Africa too, but these are white, so something new. Britain, now with nearly twenty two overseas colonies, has never really lost a war against any native force, but is soundly thrashed by a few farmboys living in the South of Africa. The queen sends reinforcements, and five thousand of these boers are taken prisoner and sent to the islan     // filled, each source gets an absolute sample-accurate start time, and from then on the audio
    // hardware fires them — main-thread jank can't touch a line again.
    let voiceNodes = [];
    function stopVoice() {
      for (const s of voiceNodes) { try { s.stop(); } catch (e) {} }
      voiceNodes = [];
    }
    async function armVoice(tl) {
      if (!VOICE_FILES.length || typeof getAudioContext !== 'function' || typeof loadBuffer !== 'function') return;
      const ac = getAudioContext();
      const barSec = 240 / SONG_BPM;
      const t0 = ac.currentTime + 0.1;       // strudel starts ~now; one small shared offset
      let a = 0;
      for (const row of tl) {
        const vi = row[4];
        if (vi != null && VOICE_FILES[vi]) {
          try {
            const buf = await loadBuffer(VOICE_BASE + VOICE_FILES[vi] + VOICE_BUST, ac);
            const src = ac.createBufferSource(); src.buffer = buf;
            const g = ac.createGain(); g.gain.value = 1.15;
            src.connect(g); g.connect(ac.destination);
            src.start(t0 + a * barSec);
            voiceNodes.push(src);
          } catch (e) { console.error('voice arm failed: line', vi + 1, e); }
        }
        a += row[0];
      }
    }
    let cachedTl = null;                     // parsed once per play — not 60×/sec off the textarea
    function trackFrame() {
      const tl = cachedTl || (cachedTl = resolvedTimeline());
      const total = tl.reduce((a, s) => a + s[0], 0);
      const bar = (performance.now() - trackT0) / 1000 / (240 / SONG_BPM);
      if (bar >= total) { finishLoop(); return; }   // one full pass through the arrangement → stop
      let acc = 0, idx = tl.length - 1;
      for (let i = 0; i < tl.length; i++) { if (bar < acc + tl[i][0]) { idx = i; break; } acc += tl[i][0]; }
      [...strip.children].forEach((el, i) => el.classList.toggle('active', i === idx));
      posEl.textContent = 'bar ' + (Math.floor(bar) + 1) + '/' + total + ' · ' + (tl[idx][1] || '');
      // the shape's words as title + subtitle (split on the em-dash) — the whole invocation shows
      const lbl = tl[idx][1] || '', dash = lbl.indexOf('—');
      wordEl.textContent = dash >= 0 ? lbl.slice(0, dash).trim() : lbl;
      subEl.textContent = dash >= 0 ? lbl.slice(dash + 1).trim() : '';
      // the typewriter: the ACTIVE line appears WORD BY WORD as it is spoken. The active line is
      // the last row at-or-before idx that fires a voice (split continuations keep typing through
      // the music change). Pacing: uniform word rate over the clip's bars, finishing a touch early
      // (~92%) since renders end in silence. The finished line stays up until the next one speaks.
      if (lyricEl && VOICE_TEXTS.length) {
        let li = null, liStart = 0, a2 = 0;
        for (let i = 0; i <= idx; i++) { if (tl[i][4] != null) { li = tl[i][4]; liStart = a2; } a2 += tl[i][0]; }
        if (li != null && VOICE_TEXTS[li] !== undefined) {
          const words = VOICE_TEXTS[li].split(' ');
          const prog = (bar - liStart) / (lineBars[li] || 4) / 0.92;
          const nw = Math.max(0, Math.min(words.length, Math.floor(words.length * prog)));
          lyricEl.textContent = nw < words.length ? words.slice(0, nw).join(' ') + ' ▍' : words.join(' ');
        } else lyricEl.textContent = '';
      }
      // the bounce is saved for the drop — a beat-phase scale pulse on the VIDEOS only (--punch);
      // the back-wall sea never bounces
      if (hasFilm) {
        const ph = (bar * 4) % 1;
        film.style.setProperty('--punch', tl[idx][2] ? String(1 + 0.16 * Math.pow(1 - ph, 3)) : '1');
      }
      syncVideo(tl, bar, !!tl[idx][2], tl[idx][3]);
      rafId = requestAnimationFrame(trackFrame);
    }
    function trackStart() {
      if (!TIMELINE.length) return;
      cachedTl = resolvedTimeline();
      trackT0 = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      if (hasFilm || hasViz) filmReset();
      trackFrame();
    }
    function trackStop() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null; posEl.textContent = '';
      if (lyricEl) lyricEl.textContent = '';
      [...strip.children].forEach(el => el.classList.remove('active'));
      if (hasFilm || hasViz) filmReset();
    }

    async function play() {
      try {
        hush(); stopVoice();
        await evaluate(editor.value);
        armVoice(resolvedTimeline());        // every line scheduled on the audio clock, up front
        setStatus('playing…'); trackStart();
      }
      catch (e) { setStatus('error: ' + (e && e.message ? e.message : e), true); }
    }
    function stop() { hush(); stopVoice(); setStatus('stopped'); trackStop(); }
    function finishLoop() { hush(); stopVoice(); trackStop(); setStatus('done · one loop — hit [ play ] again'); if (ALBUM) parent.postMessage({ cyb: 'song-done' }, '*'); }
    document.getElementById('play').addEventListener('click', play);
    document.getElementById('stop').addEventListener('click', stop);
    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); play(); }
      if ((e.ctrlKey || e.metaKey) && e.key === '.')     { e.preventDefault(); stop(); }
    });
  </script>
</body>
</html>
