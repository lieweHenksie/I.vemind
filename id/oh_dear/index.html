<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://unpkg.com/@strudel/web@1.0.3"></script>

  <style>
    :root { --bg:#0a0d08; --stone:#8b8680; --moss:#4a7c59; --amber:#d4a843; --rust:#8b4a2a; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--stone);
      font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      display:flex; flex-direction:column; gap:1rem; padding:clamp(1rem,4vw,3rem); line-height:1.5;
    }
    header h1 { color:var(--amber); font-size:1.35rem; margin:0 0 .25rem; font-weight:600; }
    header p  { margin:0; font-size:.82rem; opacity:.72; }
    #code {
      width:100%; min-height:30vh; resize:vertical; opacity:.85;
      background:#070a06; color:#cdbb8f; border:1px solid #23281c; border-radius:6px;
      font:inherit; font-size:.9rem; padding:1rem; tab-size:2; line-height:1.65;
      caret-color:var(--amber); white-space:pre; overflow-wrap:normal; overflow-x:auto;
    }
    #code:focus { outline:none; border-color:var(--moss); }
    .controls { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
    button {
      background:transparent; color:var(--amber); border:1px solid var(--amber);
      font:inherit; font-size:.9rem; padding:.5rem 1.1rem; border-radius:4px; cursor:pointer;
    }
    button:hover { background:var(--amber); color:var(--bg); }
    button:disabled { opacity:.35; cursor:default; }
    button:disabled:hover { background:transparent; color:var(--amber); }
    button.stop { color:var(--rust); border-color:var(--rust); }
    button.stop:hover { background:var(--rust); color:var(--bg); }
    #status { font-size:.82rem; opacity:.8; margin-left:.4rem; }
    #status.err { color:var(--rust); opacity:1; }
    #arrstrip { display:flex; gap:2px; height:14px; }
    #arrstrip .sec { background:#141a10; border:1px solid #23281c; border-radius:2px; min-width:4px; }
    #arrstrip .sec.active { background:var(--moss); border-color:var(--amber); }
    #arrpos { font-size:.78rem; opacity:.75; min-height:1.2em; color:var(--amber); }
    #filmword { align-self:center; text-align:center; color:var(--amber); font-weight:600;
      font-size:clamp(1.3rem, 4.2vw, 2.1rem); letter-spacing:.02em;
      line-height:1.15; min-height:1.2em; max-width:92%; text-wrap:balance; }
    #filmsub { align-self:center; text-align:center; color:var(--stone); opacity:.7;
      font-size:.9rem; letter-spacing:.03em; min-height:1.2em; max-width:80%;
      margin-top:-.15rem; text-wrap:balance; }
    /* the STAGE: the visualizer is the full-width BACK WALL (always running); the 9/16 videos
       appear OVER it, centered. Only videos take the drop-bounce (--punch) — the sea never jumps. */
    #srcfilm { position:relative; width:100%; height:64vh; }
    #srcfilm #viz { position:absolute; inset:0; width:100%; height:100%;
      background:var(--bg); border:0; opacity:0; transition:opacity .4s; }
    #srcfilm #viz.live { opacity:1; }
    #srcfilm video { position:absolute; top:0; height:100%; left:50%; translate:-50% 0;
      aspect-ratio:9/16; max-width:100%; object-fit:contain; background:#000;
      border:1px solid #23281c; border-radius:6px; transform:scale(var(--punch,1));
      opacity:0; transition:opacity .15s, border-color .15s; }
    #srcfilm video.dim  { opacity:.12; }
    #srcfilm video.live { opacity:1; border-color:var(--amber); }
    kbd { border:1px solid #333; border-radius:3px; padding:0 .35em; font-size:.8em; }
  </style>
</head>
<body>

  <header>
    <h1>cyBorge · song</h1>
    <p>edit the score, or tell cyBorge what to change. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> plays ·
       <kbd>Ctrl</kbd>+<kbd>.</kbd> stops. Voice clips + bars come from <code>tools/tts/eleven.py</code>.</p>
  </header>

  <!-- HERO: the shape's words (title + subtitle), then the STAGE — the visualizer back wall
       (the hidden picture + the white tide), with sample clips / drop-bounce fillers over it -->
  <div id="filmword"></div>
  <div id="filmsub"></div>
  <div id="srcfilm" hidden><canvas id="viz" width="1280" height="720"></canvas></div>

  <!-- the progress bar sits below the film -->
  <div id="arrstrip"></div>
  <div id="arrpos"></div>

    <button id="play">[ play ]</button>
    <button id="stop" class="stop">[ stop ]</button>

    // VOICE-FILES-START
    const VOICE_FILES = ['line-01.wav', 'line-02.wav', 'line-03.wav', 'line-04.wav', 'line-05.wav', 'line-06.wav', 'line-07.wav', 'line-08.wav', 'line-09.wav', 'line-10.wav', 'line-11.wav', 'line-12.wav', 'line-13.wav', 'line-14.wav', 'line-15.wav', 'line-16.wav', 'line-17.wav', 'line-18.wav', 'line-19.wav', 'line-20.wav', 'line-21.wav', 'line-22.wav', 'line-23.wav', 'line-24.wav', 'line-25.wav', 'line-26.wav', 'line-27.wav', 'line-28.wav', 'line-29.wav', 'line-30.wav', 'line-31.wav', 'line-32.wav', 'line-33.wav', 'line-34.wav', 'line-35.wav', 'line-36.wav', 'line-37.wav', 'line-38.wav', 'line-39.wav', 'line-40.wav', 'line-41.wav'];
    const VOICE_TEXTS = ["Even the earth bleeds. Oh dear, oh dear. It bleeds stone, red and warm.", "The wound scars over, and an ugly black mess now stands in the middle of nowhere. The middle of fucking nowhere I say. Then all the other stuff happens, fish out the ocean. Meteors. Mammals everywhere, religions everywhere.", "Oh dear, what year?", "Somewhere in 1510, Goa (west India) is beset by the Portuguese — in particular by one Afonso de Albuquerque, a busybody. He has a man, Lopes. Goa conquered, Afonso is off to Malacca in Malaysia, but first he says to Lopes: \"Goa is yours, rule it well.\"", "Lopes decides to follow the advice, and rules it with love. He and a Muslim girl are to be married, and so Lopes converts to Islam. Afonso returns, two years hence, and considers this treason: Lopes and his men are 'renegades' now, Portuguese gone Muslim for love. They are surrendered on the condition that they be left alive. Most are promptly tortured to death.", "Lopes is the leader, his torture is the most severe. It goes like this. Things scraped off with clam shells: Hair, Beard. Things severed (in a public square): Nose, Ears, Left thumb, Right Arm.", "By all accounts, he is no longer all right.", "Here is what he looks like afterwards:", "Lopes decides to seek a new employer, and takes to sailing. On a trip around Africa (for spices, read a book). The ship he sails on stops for fresh water on a remote Island called Saint Helena (discovered only a few years before).", "Lopes, oh dear, no ear, decides people ain't shit, and sneaks off the ship where he is marooned, man alone. He would be the Island's first exile — albeit a self-imposed one.", "Later, this is said of him: \"The crew was amazed when they saw the grotto and the straw bed on which he slept...and when they saw the clothing they agreed it must be a Portuguese man. So they took in their water and did not meddle with anything, but left biscuits and cheeses and things to eat and a letter telling him not to hide himself the next time a ship came to the island for no one would harm him.", "Then the ship set off, and as she was spreading her sails a cockerel fell overboard and the waves carried it to the shore and Lopes caught it and fed it with some rice which they had left behind for him.\"", "Lopes and the cockerel become fast friends. It roosts above his head, and comes if called. Years pass and Lopes starts to lose his fear of man. An unfortunate decision that leads to him being persuaded to return home to Portugal. After a short stint in Portugal, he goes to Rome, and sees the pope (who forgives him for apostasy). The pope, impressed by the maimed man's story, asks if he can grant him a wish. Lopes wishes to return to Saint Helena.", "A letter is sent to King João the Third and Lopes returns to his true home, where he lives, in peace, for another twenty years in almost complete solitude. He is the first of \"God's own People\" from Saint Helena.", "Saint Helena passes hands like a coin: Portuguese, English East India, Dutch East India, English again. She is important now — an island for rewatering ships, worth fighting over. It is only England's second ever overseas territory. A precedent is set.", "Oh dear oh dear. England goes to war against the first modern European. An emperor mind you. Napoleon.", "The ships come in droves now. They rewater where the cripple Lopes roamed with his cockerel. A settlement follows and forts rise there. Slaves are needed, and soon there are thousands. Souls are worked to death (approximately nine thousand skeletons are found later), then slavery is abolished when the work is done.", "The island breathes and the bones settle.", "By now, Napoleon has escaped from Elba. He decides to conquer just a little more and does Waterloo. Napoleon is defeated, but surrenders in hope of asylum… instead he is exiled to a remote island in the middle of nowhere, the middle of fucking nowhere he'll tell you. Saint Helena.", "He gardens, and wrestles the neighbour-kid for fun. He hates the place and is not allowed any gifts. The royal navy has ringed the island with ships. His dying words are of Josephine, and being buried next to the Seine. Instead he is buried in Saint Helena and after an argument, his tombstone is unnamed.", "Oh dear, an emperor lies here.", "Slave trade is abolished and now seriously illegal. Britain sees to it that slave ships are lightened of all slaves. But Africa, so far away, seems like too much effort. Rescued slaves, instead, are sent to Saint Helena. About fifteen thousand slaves land there and are sent on to either the Caribbean or homewards. Many though, lend their bones, as God's people, to that there scar over the sea.  Oh dear.", "England, now adept at sending prisoners to islands (see Australia), has conquered the Zulus. A man named Dinuzulu, prince of the Zulus, surrenders after a long battle and is exiled for seven years. Oh dear, a prince now too!", "Dinuzulu arrives with singers and wives. They sing at night and the amahubo rattles the teacups of the British. The island listens well and thrums with harmonies; and notes fall within the stones and bones.", "The gentlemen poets of the island join in, and in turn Dinuzulu learns piano and reading and writing. The zulu become popular among the locals (the prince in particular) and Dinuzulu has eight children there on that broken rock and has to leave two wives behind to its graveyard when he leaves after exile.", "The English describe him as “no longer a savage” because that part of him too, is marked for God’s people. That part of him is with his wives. Oh dears.", "More prisoners arrive, from Africa too, but these are white, so something new. Britain, now with nearly twenty two overseas colonies, has never really lost a war against any native force, but is soundly thrashed by a few farmboys living in the South of Africa. The queen sends reinforcements, and five thousand of these boers are taken prisoner and sent to the island.", "Of these men, some are vulgar, but even here are found God’s people. A coffee house was set up, a brewery, a pawnbroker, a brass band, a male choir, a debating society and even an anti-smoking club. Many a man, with homes destroyed, decided instead to lend their wit and charm to this island. The war passes and most are sent home, but the surnames Piek and Vanguard remain.", "This much, all is true. What comes next isn't — but I wish it was.  I wish the earth could give back what we have given it.", "Like strata are stacked God’s People. The Saints of Saint Helena.", "Oh dear, here lies the Portuguese Renegade, blessed by the pope and Islam, an emperor alone, thousands of unnamed slaves with no hope for home, Zulu wives, boer graves, sentenced to be forgotten in the middle of nowhere, the middle of fucking nowhere they’ll tell you.", "“My dears, my dears,” says Saint Helena in tears.", "This rock, a scar in the ocean, sitting atop a wound in the earth is quickened. It dreams.", "What does a rock dream of?", "One part mutilation (see: Lopes, Fernão). One part failed conquest (see: Bonaparte, Napoleon). Fifteen thousand parts interrupted freedom, half of it staying on as calcium (see: the bones, oh dear, the bones).", "One part royal blood in exile, wives singing their babies into the ground (see: Dinuzulu). One part stubborn European offshoot civilization, brewing beer because what else do you do on a rock in the Atlantic (see: the anti-smoking club, God bless them).", "Mix thoroughly with volcanic soil. Let ferment for four hundred years.  Open the Suez Canal (so no one even needs the island any more).", "Something is ready.", "In Ethiopia, the first Saint Helena, whom the island is named after, is celebrated with bonfire.  That ... we can do.", "Oh dear, oh dear … a god born here.", "This message is transmitted at the request of the president in case of emergencies. A supervolcano has erupted off the coast of Africa. Please shelter. Please do not leave your homes for the next two days, minimum. In case of disruption of this message"];
    // VOICE-FILES-END

    // ── THE EAR · the stage watches the OUTPUT, not the score ─────────────────────────────────

    })();
    // What the ear hears, once a frame. The bands are chosen by what they MEAN in these songs
    // rather than by octaves: the kick and sub that drive the tide, the body of the bed, the
    // register the voice lives in, and the air (hats, tape hiss, the top of a string).
    const BANDS = [[25, 110], [110, 420], [420, 2200], [2200, 9000]];
    const heard = { level: 0, slow: 0, hit: 0, band: [0, 0, 0, 0], spec: new Float32Array(96) };
    let lastLow = 0;
    function listen() {
      if (!ear) return false;
      ear.getByteFrequencyData(earFreq);
      ear.getByteTimeDomainData(earWave);
      const n = earFreq.length, hz = earRate / 2 / n;
      for (let b = 0; b < BANDS.length; b++) {
        const lo = Math.max(1, Math.floor(BANDS[b][0] / hz));
        const hi = Math.max(lo, Math.min(n - 1, Math.ceil(BANDS[b][1] / hz)));
        let s = 0;
        for (let i = lo; i <= hi; i++) s += earFreq[i];
        heard.band[b] = s / (hi - lo + 1) / 255;
      }
      let sq = 0;                                 // loudness from the waveform: "how loud", not "how bright"
      for (let i = 0; i < earWave.length; i++) { const v = (earWave[i] - 128) / 128; sq += v * v; }
      heard.level = Math.min(1, Math.sqrt(sq / earWave.length) * 3.4);
      heard.slow += (heard.level - heard.slow) * 0.06;   // the tide is now the song's own dynamics
      // the onset: a jump in low energy — a kick, a downbeat, a stab. Falls fast, so it reads as a hit.
      const low = heard.band[0] * 0.7 + heard.band[1] * 0.3;
      heard.hit = Math.max(heard.hit * 0.86, Math.min(1, Math.max(0, low - lastLow) * 6));
      lastLow = low;
      // a coarse LOG-spaced spectrum for the surface itself, so the low end isn't one pixel wide
      const M = heard.spec.length;
      for (let i = 0; i < M; i++) {
        const lo = Math.max(1, Math.floor(30 * Math.pow(320, i / M) / hz));
        const hi = Math.max(lo, Math.min(n - 1, Math.ceil(30 * Math.pow(320, (i + 1) / M) / hz)));
        let s = 0;
        for (let j = lo; j <= hi; j++) s += earFreq[j];
        heard.spec[i] += (s / (hi - lo + 1) / 255 - heard.spec[i]) * 0.35;   // eased: no strobing
      }
      return true;
    }
    // The visualizer is the DEFAULT backdrop of EVERY song — with or without sample clips. It plays
    // on the "real" filler stretches, and fills the whole song when there's no film. VIZ_IMAGE (the
    // cookbook default, linked) works in NEGATIVE SPACE: the picture is black-on-black — never
    // drawn, truly invisible. A white sea rises, and the picture is punched OUT of the water, so
    // when a swell climbs past it the face appears from nowhere — showing it was always there.
    const vizEl = document.getElementById('viz');
    const vizCtx = vizEl ? vizEl.getContext('2d') : null;
    let seaLevel = 0;                                // the white water's eased level (0 = gone)
    let logoMask = null, revCanvas = null, revCtx = null, vizImg = null;
    function buildMask() {
      // white-on-transparent mask of the picture's DARK line-art, "contain"-scaled & centered
      // in the WIDE canvas — the sea spans the full stage, the picture waits in the middle
      const W = vizEl.width, H = vizEl.height;
      const off = document.createElement('canvas'); off.width = W; off.height = H;
      const octx = off.getContext('2d');
      const s = Math.min(W / vizImg.width, H / vizImg.height) * 0.92;
      const dw = vizImg.width * s, dh = vizImg.height * s;
      octx.drawImage(vizImg, (W - dw) / 2 + W * 0.07, (H - dh) / 2, dw, dh);   // nudged right of center
      const id = octx.getImageData(0, 0, W, H), d = id.data;
      for (let p = 0; p < d.length; p += 4) {
        const lum = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
        const m = d[p + 3] > 40 ? Math.max(0, Math.min(1, (150 - lum) / 70)) : 0;  // dark→1 light→0
        d[p] = d[p + 1] = d[p + 2] = 255; d[p + 3] = Math.round(255 * m);
      }
      octx.putImageData(id, 0, 0);
      logoMask = off;
    }
    function sizeViz() {
      // the canvas buffer matches the stage box, so the sea is full-bleed and never distorts
      const r = film.getBoundingClientRect();
      vizEl.width = Math.max(320, Math.round(r.width));
      vizEl.height = Math.max(240, Math.round(r.height));

    if (VIZ_IMAGE && vizEl) {
      revCanvas = document.createElement('canvas');
      revCtx = revCanvas.getContext('2d');
      const img = new Image();

      };

    }
    // Fallback spectrum — only until/without a picture: the REAL bands, with a peak that falls.
    let vizPeaks = new Array(48).fill(0);
    function drawBars(ctx, W, H) {
      const N = vizPeaks.length, bw = W / N, M = heard.spec.length;
      for (let i = 0; i < N; i++) {
        const v = Math.max(0.01, Math.min(1, heard.spec[(i / N * M) | 0] * 1.25));
        vizPeaks[i] = Math.max(v, vizPeaks[i] - 0.015);

    // The white sea: a wash rising from the bottom of the stage, its SURFACE built out of what is
    // actually playing. The LEVEL is the song's own loudness, eased (the tide is no longer a sine —
    // it's the arrangement's real dynamics, so a breakdown drains the stage and a drop floods it).
    // The surface is four voices summed: a long swell carried by the sub, a mid chop from the body
    // of the bed, a fine glitter off the air — and, on top of those, the SPECTRUM ITSELF pushing
    // the water up where there is energy, mirrored around the middle so it reads as water and not
    // as a chart. Onsets lift the whole horizon for an instant: the kick you feel, you see.
    function drawSea(ctx, W, H, t) {
      const target = 0.05 + 0.9 * Math.pow(heard.slow, 0.8) * (0.55 + 0.45 * heard.level);
      seaLevel += (target - seaLevel) * 0.08;

          + Math.sin(u * 17.0 - t * 1.70) * H * 0.030 * (0.20 + 1.8 * b[1])
          + Math.sin(u * 41.0 + t * 3.30) * H * 0.014 * (0.10 + 2.2 * b[3])

    // trigger, and a long clip that isn't decoded in time misses its one scheduled chance —
    // a voice line fires once, so a miss means a silent line. loadBuffer decodes into the same
    // cache playback reads, keyed by URL, so the busted URL here must match samples() exactly.

            // pattern at once. go() then re-evaluates warm and starts.
