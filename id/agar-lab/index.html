<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyBorge — song</title>

  <!-- Strudel, no build step. One script tag. Pinned; bump the version freely. -->
  <script src="https://unpkg.com/@strudel/web@1.0.3"></script>

  <style>
    :root { --bg:#0a0d08; --stone:#8b8680; --moss:#4a7c59; --amber:#d4a843; --rust:#8b4a2a; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--stone);
      font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      display:flex; flex-direction:column; gap:1rem; padding:clamp(1rem,4vw,3rem); line-height:1.5;
    }
    header h1 { color:var(--amber); font-size:1.35rem; margin:0 0 .25rem; font-weight:600; }
    header p  { margin:0; font-size:.82rem; opacity:.72; }
    #code {
      width:100%; min-height:30vh; resize:vertical; opacity:.85;
      background:#070a06; color:#cdbb8f; border:1px solid #23281c; border-radius:6px;
      font:inherit; font-size:.9rem; padding:1rem; tab-size:2; line-height:1.65;
      caret-color:var(--amber); white-space:pre; overflow-wrap:normal; overflow-x:auto;
    }
    #code:focus { outline:none; border-color:var(--moss); }
    .controls { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
    button {
      background:transparent; color:var(--amber); border:1px solid var(--amber);
      font:inherit; font-size:.9rem; padding:.5rem 1.1rem; border-radius:4px; cursor:pointer;
    }
    button:hover { background:var(--amber); color:var(--bg); }
    button:disabled { opacity:.35; cursor:default; }
    button:disabled:hover { background:transparent; color:var(--amber); }
    button.stop { color:var(--rust); border-color:var(--rust); }
    button.stop:hover { background:var(--rust); color:var(--bg); }
    #status { font-size:.82rem; opacity:.8; margin-left:.4rem; }
    #status.err { color:var(--rust); opacity:1; }
    #arrstrip { display:flex; gap:2px; height:14px; }
    #arrstrip .sec { background:#141a10; border:1px solid #23281c; border-radius:2px; min-width:4px; }
    #arrstrip .sec.active { background:var(--moss); border-color:var(--amber); }
    #arrpos { font-size:.78rem; opacity:.75; min-height:1.2em; color:var(--amber); }
    #filmword { align-self:center; text-align:center; color:var(--amber); font-weight:600;
      font-size:clamp(1.3rem, 4.2vw, 2.1rem); letter-spacing:.02em;
      line-height:1.15; min-height:1.2em; max-width:92%; text-wrap:balance; }
    #filmsub { align-self:center; text-align:center; color:var(--stone); opacity:.7;
      font-size:.9rem; letter-spacing:.03em; min-height:1.2em; max-width:80%;
      margin-top:-.15rem; text-wrap:balance; }
    /* the STAGE: the visualizer is the full-width BACK WALL (always running); the 9/16 videos
       appear OVER it, centered. Only videos take the drop-bounce (--punch) — the sea never jumps. */
    #srcfilm { position:relative; width:100%; height:64vh; }
    #srcfilm #viz { position:absolute; inset:0; width:100%; height:100%;
      background:var(--bg); border:0; opacity:0; transition:opacity .4s; }
    #srcfilm #viz.live { opacity:1; }
    #srcfilm video { position:absolute; top:0; height:100%; left:50%; translate:-50% 0;
      aspect-ratio:9/16; max-width:100%; object-fit:contain; background:#000;
      border:1px solid #23281c; border-radius:6px; transform:scale(var(--punch,1));
      opacity:0; transition:opacity .15s, border-color .15s; }
    #srcfilm video.dim  { opacity:.12; }
    #srcfilm video.live { opacity:1; border-color:var(--amber); }
    /* the spoken words, typewritten word by word as they are said — bold amber, like the title,
       but in the story font (the human layer) */
    #lyric { align-self:center; text-align:center; max-width:64ch; min-height:2.8em;
      font-family:"Libre Baskerville", Georgia, "Times New Roman", serif;
      font-size:1.05rem; font-weight:700; line-height:1.45; color:var(--amber);
      text-wrap:balance; }
    kbd { border:1px solid #333; border-radius:3px; padding:0 .35em; font-size:.8em; }
  </style>
</head>
<body>

  <header>
    <h1>cyBorge · song</h1>
    <p>edit the score, or tell cyBorge what to change. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> plays ·
       <kbd>Ctrl</kbd>+<kbd>.</kbd> stops. Voice clips + bars come from <code>tools/tts/eleven.py</code>.</p>
  </header>

  <!-- HERO: the shape's words (title + subtitle), then the STAGE — the visualizer back wall
       (the hidden picture + the white tide), with sample clips / drop-bounce fillers over it -->
  <div id="filmword"></div>
  <div id="filmsub"></div>
  <div id="srcfilm" hidden><canvas id="viz" width="1280" height="720"></canvas></div>

  <!-- the spoken line, typed as it is said -->
  <div id="lyric"></div>

  <!-- the progress bar sits below the film -->
  <div id="arrstrip"></div>
  <div id="arrpos"></div>

  <div class="controls">
    <button id="play">[ play ]</button>
    <button id="stop" class="stop">[ stop ]</button>
    <span id="status">booting strudel…</span>
  </div>

  <!-- the score, moved below — edit it or tell cyBorge what to change -->
  <textarea id="code" spellcheck="false">
// ─ cyBorge song · palette in cookbook/strudel/palette.md, form in arrangement.md ─

// ── instruments · GENERATED by tools/song/build.py from song.json (markers below) ──
// INSTRUMENTS-START
let bass = note("a1 a1 e2 g1 a1 a1 c2 e2").s("sawtooth").lpf(sine.range(250,900).slow(8)).lpq(8).gain(0.8)
let kick = note("a1 ~ ~ ~ a1 ~ ~ ~").s("sine").attack(0.001).decay(0.28).sustain(0).gain(1)
let hats = s("white*8").decay(0.02).sustain(0).hpf(8000).gain(0.22)
let clap = s("~ white ~ white").decay(0.09).sustain(0).hpf(1400).gain(0.4).room(0.35)
let arp = note("[a3 e4 c4 e4 g4 e4 c4 b3]*2").s("triangle").lpf(1600).delay(0.5).delaytime(0.375).delayfeedback(0.35).room(0.6).gain(0.45)
let arpFast = note("[a3 c4 e4 g4 a4 g4 e4 c4]*4").s("square").lpf(2200).delay(0.4).delaytime(0.1875).delayfeedback(0.3).room(0.5).gain(0.28)
let pad = note("<[a3,c4,e4] [f3,a3,c4] [c3,e3,g3] [e3,g3,b3]>").s("sawtooth").attack(0.8).release(1.5).lpf(700).gain(0.3).room(0.85)
let lead = note("<a4 c5 b4 e4>").s("triangle").lpf(1300).release(0.3).room(0.7).gain(0.5)
let solo = note("<[a4 c5 e5 d5 c5 b4 a4 e4] [g4 a4 b4 c5 e5 d5 b4 a4]>").s("triangle").lpf(2400).delay(0.4).delaytime(0.375).delayfeedback(0.4).room(0.5).gain(0.5)
let wash = s("white").lpf(500).gain(0.12).room(0.9)
let riser = s("white").lpf(saw.range(300,8000).slow(8)).gain(0.18).room(0.7)
let impact = note("a0").s("sine").attack(0.001).decay(1.6).sustain(0).gain(1).room(0.85)
let subHard = note("a0 a0 e1 a0 g0 a0 e1 g0").s("sawtooth").shape(0.45).lpf(600).lpq(4).gain(0.78)
let fromforest = note("<a4 c5 e5 b4>").s("triangle").attack(0.4).release(1.4).lpf(1400).room(0.85).gain(0.28)
let towardsea = note("<[a2,c3,e3] [a2,c3,e3] [g2,bb2,d3] [g2,bb2,d3]>").s("sawtooth").attack(1.6).release(2.4).lpf(500).gain(0.24).room(0.92)
// INSTRUMENTS-END

// ── voice timing · auto-managed by tools/tts/eleven.py (don't hand-edit) ──
// BARS-START
let bars = [3, 6, 3, 3, 5, 8, 6, 13, 10, 13, 5, 22, 3, 10, 9, 10]   // auto-generated per line length — do not hand-edit
// BARS-END
let vo = (clip, i) => clip.slow(bars[i]).gain(1.15).room(0.2)

// ── the arrangement · GENERATED by tools/song/build.py from song.json (markers below) ──
// ARRANGE-START
arrange(
  [4, stack(bass, fromforest).postgain(saw.range(0,1).slow(4))],   // intro
  [4, stack(bass, kick)],
  [2, stack(bass, kick, hats)],
  [2, stack(bass, kick, hats, arp)],
  [bars[0], stack(kick, hats, bass, arp)],
  [bars[1], stack(kick, hats, clap, bass, arp, pad)],
  [bars[2], bass],   // dialogue — bare
  [bars[3], stack(bass, kick)],
  [bars[4], stack(kick, hats, clap, bass, arpFast, pad)],   // swords
  [3, stack(kick, hats, clap, bass, arp, pad, lead, solo)],   // slug — mid-drop
  [2, bass],   // …voice 5 rings on, bars shift
  [3, stack(kick, hats, bass, subHard, solo)],   // …voice 5 rings on, bars shift
  [2, stack(bass, wash)],   // breakdown
  [2, stack(bass, riser, wash)],   // rise
  [2, stack(impact, kick, subHard)],   // HARDCORE drop
  [6, stack(kick, hats, clap, subHard, arpFast, solo)],   // hardcore
  [4, stack(kick, hats, clap, bass, arpFast, lead)],   // climax
  [bars[6], stack(kick, hats, bass, arp)],   // club Cuomo
  [5, stack(kick, hats, clap, bass, arpFast, pad)],   // night blurs — mid-drop
  [4, stack(bass, wash)],   // …voice 7 rings on, bars shift
  [4, stack(kick, hats, bass, arp, solo)],   // …voice 7 rings on, bars shift
  [bars[8], stack(kick, hats, bass, arp, pad)],   // waiter
  [6, stack(kick, hats, clap, bass, arp, pad, solo)],   // his name — mid-drop
  [3, bass],   // …voice 9 rings on, bars shift
  [3, stack(kick, hats, clap, bass, subHard, lead, solo)],   // …voice 9 rings on, bars shift
  [bars[10], stack(kick, hats, clap, bass, arpFast, pad, lead, solo)],   // the last ones — it closes at 1am because of us
  [bars[11], stack(bass, pad)],   // two taxis home — he is 37 this year
  [bars[12], pad],   // brilliant is a name too — a person too
  [bars[13], stack(bass, pad)],   // thousands of brilliants — zoom out
  [bars[14], pad],   // the names outlast — smooth as river stones
  [bars[15], stack(pad, fromforest)],   // in the name — brilliant is a god too
  [8, stack(bass, lead)],   // outro
  [4, towardsea.postgain(saw.range(1,0).slow(4))],   // toward the sea — down a tone to G
)
// ARRANGE-END
</textarea>

  <script>
    const editor = document.getElementById('code');
    const statusEl = document.getElementById('status');
    const setStatus = (m, err=false) => { statusEl.textContent = m; statusEl.classList.toggle('err', err); };

    // Voice clips + ONE shared cache-buster (used for BOTH sample registration and the preload).
    // VOICE-FILES-START
    const VOICE_FILES = ['line-01.wav', 'line-02.wav', 'line-03.wav', 'line-04.wav', 'line-05.wav', 'line-06.wav', 'line-07.wav', 'line-08.wav', 'line-09.wav', 'line-10.wav', 'line-11.wav', 'line-12.wav', 'line-13.wav', 'line-14.wav', 'line-15.wav', 'line-16.wav'];
    const VOICE_TEXTS = ["There is a man that lives in the hotel, she said, that recommended club Cuomo.", "He seemed cool, she assures us and I ask if he was wearing wooden beads, like a bhuddist monk might, but she seems confused.", "\"What made him seem cool?\" I ask.", "\"I don't know, he had a cigar,\" she says.", "In the Taxi, I picture cool people, many are black, but more have swords.  None ... have cigars.", "I watch the streetlights make little slugs of light crawling over a misty grey night. Could the others in the taxi tell how cool they were? The slugs? None of the slugs had cigars either.", "When we get to club Cuomo,  it turns out pretty cool. Maybe because of all the black people? But I keep my eyes out for swords just in case.", "The night becomes a blur of conversation and I ask the others if they've heard about how you're supposed to put a finger in a dog's rectum when it bites? They seem ignorant of that myth.  I only brought it up to dispell it in the first place.  It doesn't work, trust me. I backtrack and tell them that it doesn't work and I never should have brought it up, since they already knew.  They seem like they agree.", "Our waiter comes, he is middle-aged and skinny. His English is broken. I feel sorry for him, but I cannot say why. He probably never had to have his finger up a pitbull's rectum when it didn't want to release his scared and confused old dog.", "I ask his name, and he says \"I'm Brilliant\" and I am terrified that my friends will say something about his name, that they will tease him. Because they have a habit of making terrible jokes like that. But they don't. And I am relieved and I am happy. And I think... Wow, Brilliant is a name too. Brilliant is a name too.", "We are the last ones in the restaurant. It closes at 1am because of us!  How cool!", "Brilliant leaves at 1:30. He needs to clean first. Minibus taxis are sparse this time of night. He waits another half an hour, then takes two separate taxis to his corrugated tin shack. In the taxi he can't help but marvel at how cool the lights are. They are like little slugs in the mist. He showers in a bucket, by standing in it and squeezing a sponge so that hot water flows from where he sponges back into the bucket. There is no shower in his shack. He is 37 this year. He has been a waiter for 10 of those years. His 10 hour shift starts in 7 hours from now.  Brilliant.", "Brilliant is a name too.  Brilliant is a person too.", "Zoom out. There are thousands of Brilliants. There are Gifts and Blessings and Preciouses and one or two Innocents, carrying plates, carrying mops, carrying other people's keys. A mother names her child like a prayer, and hands him to the world.", "The people wear out. The names don't. A name gets handed on, mother to child, prayer to prayer, until it is smooth as a river stone. Tough times ever last. Tough people never do.", "So this is where this god is born. Not in the shack. Not in the taxi. In the name — a god assembled from every prayer a mother ever hid inside one. Brilliant is a god too."];
    // VOICE-FILES-END
    const VOICE_BASE = new URL('audio/voice/', location.href).href;
    const VOICE_BUST = '?t=' + Date.now();

    // The crate: extra samples cut by tools/song/sample.py · managed by tools/song/build.py
    // from palette.json's _samples map (don't hand-edit).
    // SAMPLE-FILES-START
    const SAMPLE_FILES = {};
    // SAMPLE-FILES-END
    const SAMPLE_BASE = new URL('.', location.href).href;

    // ── the source film · clips + cues + fillers + viz image, generated by tools/song/build.py ──
    // VIDEO-CUES-START
    const VIZ_IMAGE = "../../cookbook/strudel/laughing-man.png";
    const FILLER_CLIPS = [];
    const VIDEO_CLIPS = {};
    const VIDEO_CUES = [];
    // VIDEO-CUES-END
    const film = document.getElementById('srcfilm');
    const mkVid = (path) => {
      const v = document.createElement('video');
      v.src = path; v.muted = true; v.playsInline = true; v.preload = 'auto';
      film.appendChild(v);
      return v;
    };
    const clipVids = {};
    for (const [name, path] of Object.entries(VIDEO_CLIPS)) clipVids[name] = mkVid(path);
    const fillerVids = FILLER_CLIPS.map(mkVid);
    const allVids = () => [...Object.values(clipVids), ...fillerVids];
    const hasFilm = allVids().length > 0;
    const hasViz = !!(VIZ_IMAGE && document.getElementById('viz'));
    if (hasFilm || hasViz) film.hidden = false;
    let curCue = -1, activeVid = null;
    const setFilm = (v, cls) => {   // cls: 'live' | 'dim' | 'off'
      if (!v) return;
      v.classList.toggle('live', cls === 'live');
      v.classList.toggle('dim', cls === 'dim');
    };
    const showVid = (v, off) => {   // a small clip PLAYED FROM `off` (~0) — the path that never froze
      if (activeVid && activeVid !== v) { setFilm(activeVid, 'off'); activeVid.pause(); }
      activeVid = v; setFilm(v, 'live');
      try { v.currentTime = off || 0; } catch (e) {}
      v.play().catch(() => {});
    };
    // The visualizer is the DEFAULT backdrop of EVERY song — with or without sample clips. It plays
    // on the "real" filler stretches, and fills the whole song when there's no film. Procedural,
    // synced to the bar clock (no tap into Strudel's audio graph). VIZ_IMAGE (the cookbook default,
    // linked) works in NEGATIVE SPACE: the picture is black-on-black — never drawn, truly invisible.
    // A white sea rises on a slow tide, and the picture is punched OUT of the water, so when a swell
    // climbs past it the face appears from nowhere — showing it was always there.
    const vizEl = document.getElementById('viz');
    const vizCtx = vizEl ? vizEl.getContext('2d') : null;
    let seaLevel = 0;                                // the white water's eased level (0 = gone)
    let logoMask = null, revCanvas = null, revCtx = null, vizImg = null;
    function buildMask() {
      // white-on-transparent mask of the picture's DARK line-art, "contain"-scaled & centered
      // in the WIDE canvas — the sea spans the full stage, the picture waits in the middle
      const W = vizEl.width, H = vizEl.height;
      const off = document.createElement('canvas'); off.width = W; off.height = H;
      const octx = off.getContext('2d');
      const s = Math.min(W / vizImg.width, H / vizImg.height) * 0.92;
      const dw = vizImg.width * s, dh = vizImg.height * s;
      octx.drawImage(vizImg, (W - dw) / 2 + W * 0.07, (H - dh) / 2, dw, dh);   // nudged right of center
      const id = octx.getImageData(0, 0, W, H), d = id.data;
      for (let p = 0; p < d.length; p += 4) {
        const lum = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
        const m = d[p + 3] > 40 ? Math.max(0, Math.min(1, (150 - lum) / 70)) : 0;  // dark→1 light→0
        d[p] = d[p + 1] = d[p + 2] = 255; d[p + 3] = Math.round(255 * m);
      }
      octx.putImageData(id, 0, 0);
      logoMask = off;
    }
    function sizeViz() {
      // the canvas buffer matches the stage box, so the sea is full-bleed and never distorts
      const r = film.getBoundingClientRect();
      vizEl.width = Math.max(320, Math.round(r.width));
      vizEl.height = Math.max(240, Math.round(r.height));
      revCanvas.width = vizEl.width; revCanvas.height = vizEl.height;
      if (vizImg) buildMask();
    }
    if (VIZ_IMAGE && vizEl) {
      revCanvas = document.createElement('canvas');
      revCtx = revCanvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        vizImg = img; sizeViz();
        if (!rafId) vizRest();                       // sit pure black until play — nothing shows
      };
      img.src = VIZ_IMAGE;
      addEventListener('resize', () => { if (vizImg) { sizeViz(); if (!rafId) vizRest(); } });
    }
    // Fallback spectrum — only shown until/without a logo image: a plain amber/moss bar meter.
    let vizPeaks = new Array(32).fill(0);
    function drawBars(ctx, bar, W, H) {
      const N = 32, bw = W / N;
      const pulse = Math.pow(1 - (bar * 4) % 1, 1.6);
      for (let i = 0; i < N; i++) {
        const bass = 1 - i / N;
        const shimmer = 0.5 + 0.5 * Math.sin(i * 0.7 + bar * 6.3 + Math.sin(i * 1.3));
        let hgt = (0.12 + 0.88 * shimmer) * (0.32 + 0.68 * (0.4 + 0.6 * bass) * pulse);
        hgt = Math.max(0.03, Math.min(1, hgt));
        const x = i * bw + 1, bwid = bw - 2;
        vizPeaks[i] = Math.max(hgt, vizPeaks[i] - 0.02);
        ctx.fillStyle = i % 3 === 0 ? '#4a7c59' : '#d4a843';
        ctx.fillRect(x, H - hgt * H, bwid, hgt * H);
        ctx.fillStyle = '#cdbb8f';
        ctx.fillRect(x, H - vizPeaks[i] * H - 2, bwid, 2);
      }
    }
    // The SLOW tide: two incommensurate low sines → mostly low water, rare aligned swells.
    // Periods 11 & 6.5 bars → ~11-19s breathing at ~140bpm; the swells never repeat the same way.
    function vizTide(bar) {
      const a = 0.5 + 0.5 * Math.sin(bar * Math.PI * 2 / 11);
      const b = 0.5 + 0.5 * Math.sin(bar * Math.PI * 2 / 6.5 + 1.3);
      return Math.pow(a * b, 1.4);
    }
    // The white sea: a filled wash rising from the bottom, its surface slow drifting sines that
    // CHOP on the beat. The level EASES toward its target so the water never jumps — but the
    // target listens to the music: the slow tide × the section's energy, plus a lift on each kick.
    function drawSea(ctx, bar, W, H, target, beat) {
      seaLevel += (target - seaLevel) * 0.05;
      const base = H * (1 - seaLevel) - H * 0.025 * beat;   // the whole surface lifts on the kick
      const amp = 1 + 1.6 * beat;                           // and the waves chop harder
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 4) {
        const y = base
          + Math.sin(x * 0.022 + bar * 2.6) * H * 0.025 * amp
          + Math.sin(x * 0.011 - bar * 1.3 + 2) * H * 0.04 * amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
    function drawViz(bar, energy) {
      if (!vizCtx) return;
      const W = vizEl.width, H = vizEl.height;
      vizCtx.clearRect(0, 0, W, H);
      if (!logoMask) { drawBars(vizCtx, bar, W, H); return; }   // plain spectrum until/without a logo
      const tide = vizTide(bar);
      const beat = Math.pow(1 - (bar * 4) % 1, 2);              // a fresh kick every beat, fading fast
      const e = (energy === undefined) ? 0.6 : energy;
      revCtx.clearRect(0, 0, W, H);
      drawSea(revCtx, bar, W, H, (0.06 + 0.92 * tide) * (0.3 + 0.7 * e), beat);
      revCtx.globalCompositeOperation = 'destination-out';
      revCtx.drawImage(logoMask, 0, 0);                // the picture is a HOLE in the water
      revCtx.globalCompositeOperation = 'source-over';
      vizCtx.drawImage(revCanvas, 0, 0);
    }
    const hideViz = () => { if (vizEl) vizEl.classList.remove('live'); };
    function vizRest() {                             // at rest: pure black — the picture invisible
      if (!vizCtx) return;
      vizEl.classList.add('live');
      vizCtx.clearRect(0, 0, vizEl.width, vizEl.height);
      seaLevel = 0;
    }
    function showViz(bar, energy) {                  // the back wall — coexists with videos over it
      if (vizEl) vizEl.classList.add('live');
      drawViz(bar, energy);
    }
    const vidsOff = () => {                          // a true filler stretch: backdrop alone
      if (activeVid) { setFilm(activeVid, 'off'); activeVid.pause(); activeVid = null; }
      curCue = -1;
    };
    // On a DROP gap a filler clip cuts on the beat (busy energy); the bounce is added by trackFrame.
    function fillerFrame(bar, punch) {
      if (!fillerVids.length) { setFilm(activeVid, 'dim'); if (activeVid) activeVid.pause(); return; }
      const n = Math.floor(punch ? bar * 4 : bar);
      const v = fillerVids[((n % fillerVids.length) + fillerVids.length) % fillerVids.length];
      if (v !== activeVid) showVid(v, 0);
    }
    function syncVideo(tl, bar, punch, energy) {
      let vidUp = false;
      if (hasFilm) {
        const starts = []; let acc = 0;
        tl.forEach(s => { starts.push(acc); acc += s[0]; });
        let hit = -1;
        for (let i = 0; i < VIDEO_CUES.length; i++) {
          const [row, off, dur] = VIDEO_CUES[i];
          const from = starts[row] + off;
          const to = from + Math.min(dur, tl[row][0] - off);
          if (bar >= from && bar < to) hit = i;
        }
        if (hit >= 0) {                            // a sample cue → its clip appears over the sea
          if (hit !== curCue) { const v = clipVids[VIDEO_CUES[hit][3]]; if (v) showVid(v, VIDEO_CUES[hit][4]); curCue = hit; }
          vidUp = true;
        } else if (punch && fillerVids.length) {   // a drop gap → bouncing filler clips over the sea
          fillerFrame(bar, punch);
          curCue = -1;
          vidUp = true;
        }
      }
      if (!vidUp) vidsOff();
      // the back wall runs the WHOLE song (fallback spectrum only fills real gaps, never sits under video)
      if (hasViz || !vidUp) showViz(bar, energy); else hideViz();
    }
    const filmReset = () => {
      for (const v of allVids()) { try { v.pause(); } catch (e) {} setFilm(v, 'off'); }
      hideViz(); vizPeaks.fill(0); seaLevel = 0;
      film.style.removeProperty('--punch'); curCue = -1; activeVid = null;
      if (hasViz) vizRest();                         // settle back to black — the picture hides
    };

    let booted = false;
    try {
      initStrudel({ prebake: async () => {
        if (VOICE_FILES.length)
          await samples({ voice: VOICE_FILES.map(f => f + VOICE_BUST) }, VOICE_BASE);
        for (const [name, file] of Object.entries(SAMPLE_FILES))
          await samples({ [name]: file + VOICE_BUST }, SAMPLE_BASE);
      }});
      booted = true;
    } catch (e) { setStatus('strudel failed to boot: ' + (e && e.message ? e.message : e), true); }

    // Safety net: polyfill arrange() from timeCat if this build lacks it.
    if (booted && typeof arrange === 'undefined') {
      const tc = (typeof timeCat === 'function') ? timeCat : (typeof timecat === 'function') ? timecat : null;
      if (tc) window.arrange = (...secs) => tc(...secs).slow(secs.reduce((a,s)=>a+s[0],0));
    }

    // ── album mode · framed by an album page (?album=1): auto-play when the gate opens, and
    // report the one-loop finish so the album advances. The album's <iframe allow="autoplay">
    // delegates the listener's single click to every track.
    const QS = new URLSearchParams(location.search);
    const ALBUM = QS.has('album') && window.parent !== window;
    // &hold = preloaded by the album in a hidden frame: fill the gate, report ready, then WAIT
    // for {cyb:'go'} — so the next track starts in milliseconds, not a load-gap.
    const HOLD = ALBUM && QS.has('hold');

    // Preload voice clips + crate samples + the film clips BEFORE enabling play. This must go
    // through Strudel's OWN loadBuffer (not a bare fetch): Strudel decodes lazily at first
    // trigger, and a long clip that isn't decoded in time misses its one scheduled chance —
    // a voice line fires once, so a miss means a silent line. loadBuffer decodes into the same
    // cache playback reads, keyed by URL, so the busted URL here must match samples() exactly.
    if (booted) {
      const playBtn = document.getElementById('play');
      playBtn.disabled = true;               // truly gated — not just a status line
      setStatus('loading voice…');
      const urls = [...VOICE_FILES.map(f => VOICE_BASE + f + VOICE_BUST),
                    ...Object.values(SAMPLE_FILES).map(f => SAMPLE_BASE + f + VOICE_BUST)];
      const ac = (typeof getAudioContext === 'function') ? getAudioContext() : null;
      let ok = 0, bad = 0;
      const tick = () => setStatus('loading voice… ' + (ok + bad) + '/' + urls.length
                                   + (bad ? ' (' + bad + ' FAILED)' : ''));
      const load1 = (u) => (ac && typeof loadBuffer === 'function') ? loadBuffer(u, ac) : fetch(u);
      const load = (u, tries) => load1(u).catch(e => tries > 0 ? load(u, tries - 1) : Promise.reject(e));
      const waits = urls.map(u => load(u, 2).then(() => { ok++; tick(); },
                                                  () => { bad++; tick(); console.error('clip failed:', u); }));
      for (const v of allVids()) waits.push(new Promise(res => {
        if (v.readyState >= 3) return res();
        v.addEventListener('canplaythrough', res, { once: true });
        setTimeout(res, 8000);   // never hang the gate on a slow clip
      }));
      Promise.all(waits).then(() => {
        playBtn.disabled = false;
        setStatus(bad ? 'ready — but ' + bad + ' clip(s) FAILED (see console; they may start late)'
                      : 'ready — hit [ play ]');
        if (ALBUM) {
          const go = () => { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); play(); };
          if (HOLD) {
            window.addEventListener('message', (e) => { if (e.data && e.data.cyb === 'go') go(); });
            parent.postMessage({ cyb: 'song-ready' }, '*');
          } else go();
        }
      });
    }

    // ── the arrangement eye · TIMELINE generated by tools/song/build.py (markers below) ──
    // TIMELINE-START
    const TIMELINE = [[4, "intro", 0, 0.22, null], [4, "", 0, 0.22, null], [2, "", 0, 0.33, null], [2, "", 0, 0.44, null], ["V0", "", 0, 0.56, 0], ["V1", "", 0, 0.78, 1], ["V2", "dialogue — bare", 0, 0.22, 2], ["V3", "", 0, 0.33, 3], ["V4", "swords", 0, 0.78, 4], [3, "slug — mid-drop", 1, 1.0, 5], [2, "slug — mid-drop", 1, 0.11, null], [3, "slug — mid-drop", 1, 0.56, null], [2, "breakdown", 0, 0.22, null], [2, "rise", 0, 0.33, null], [2, "HARDCORE drop", 1, 0.33, null], [6, "hardcore", 0, 0.67, null], [4, "climax", 0, 0.67, null], ["V6", "club Cuomo", 0, 0.56, 6], [5, "night blurs — mid-drop", 1, 0.78, 7], [4, "night blurs — mid-drop", 1, 0.22, null], [4, "night blurs — mid-drop", 1, 0.56, null], ["V8", "waiter", 0, 0.67, 8], [6, "his name — mid-drop", 1, 0.89, 9], [3, "his name — mid-drop", 1, 0.11, null], [3, "his name — mid-drop", 1, 0.78, null], ["V10", "the last ones — it closes at 1am because of us", 0, 1.0, 10], ["V11", "two taxis home — he is 37 this year", 0, 0.33, 11], ["V12", "brilliant is a name too — a person too", 0, 0.22, 12], ["V13", "thousands of brilliants — zoom out", 0, 0.33, 13], ["V14", "the names outlast — smooth as river stones", 0, 0.22, 14], ["V15", "in the name — brilliant is a god too", 0, 0.33, 15], [8, "outro", 0, 0.22, null], [4, "toward the sea — down a tone to G", 0, 0.11, null]];
    const SONG_BPM = 120;
    // TIMELINE-END
    const strip = document.getElementById('arrstrip');
    const posEl = document.getElementById('arrpos');
    const wordEl = document.getElementById('filmword');
    const subEl = document.getElementById('filmsub');
    const lyricEl = document.getElementById('lyric');
    let lineBars = [];                       // set by resolvedTimeline from the score's bars
    if (TIMELINE.length) {
      TIMELINE.forEach(([bars]) => {
        const b = document.createElement('div');
        b.className = 'sec';
        b.style.flexGrow = (typeof bars === 'number') ? bars : 4;
        strip.appendChild(b);
      });
    } else { strip.style.display = 'none'; }
    let rafId = null, trackT0 = null;
    function resolvedTimeline() {
      // "V3" entries are voice sections — their length lives in the score's `bars` array
      const m = editor.value.match(/let bars = \[([^\]]*)\]/);
      const barsArr = m && m[1].trim() ? m[1].split(',').map(Number) : [];
      lineBars = barsArr;                    // the typewriter paces each line by its clip length
      return TIMELINE.map(([b, l, p, e, vi]) => [(typeof b === 'string') ? (barsArr[+b.slice(1)] || 4) : b, l, p,
                                                 (e === undefined) ? 0.6 : e,
                                                 (vi === undefined) ? null : vi]);
    }
    // ── the voice bus · BULLETPROOF one-shots ──
    // Voice lines are NOT strudel events (a one-shot event can start late or be skipped when the
    // main thread is busy rendering — and a line only fires once). Instead, at play we arm EVERY
    // line directly on the WebAudio clock: buffers come from the same loadBuffer cache the gate
    // filled, each source gets an absolute sample-accurate start time, and from then on the audio
    // hardware fires them — main-thread jank can't touch a line again.
    let voiceNodes = [];
    function stopVoice() {
      for (const s of voiceNodes) { try { s.stop(); } catch (e) {} }
      voiceNodes = [];
    }
    async function armVoice(tl) {
      if (!VOICE_FILES.length || typeof getAudioContext !== 'function' || typeof loadBuffer !== 'function') return;
      const ac = getAudioContext();
      const barSec = 240 / SONG_BPM;
      const t0 = ac.currentTime + 0.1;       // strudel starts ~now; one small shared offset
      let a = 0;
      for (const row of tl) {
        const vi = row[4];
        if (vi != null && VOICE_FILES[vi]) {
          try {
            const buf = await loadBuffer(VOICE_BASE + VOICE_FILES[vi] + VOICE_BUST, ac);
            const src = ac.createBufferSource(); src.buffer = buf;
            const g = ac.createGain(); g.gain.value = 1.15;
            src.connect(g); g.connect(ac.destination);
            src.start(t0 + a * barSec);
            voiceNodes.push(src);
          } catch (e) { console.error('voice arm failed: line', vi + 1, e); }
        }
        a += row[0];
      }
    }
    let cachedTl = null;                     // parsed once per play — not 60×/sec off the textarea
    function trackFrame() {
      const tl = cachedTl || (cachedTl = resolvedTimeline());
      const total = tl.reduce((a, s) => a + s[0], 0);
      const bar = (performance.now() - trackT0) / 1000 / (240 / SONG_BPM);
      if (bar >= total) { finishLoop(); return; }   // one full pass through the arrangement → stop
      let acc = 0, idx = tl.length - 1;
      for (let i = 0; i < tl.length; i++) { if (bar < acc + tl[i][0]) { idx = i; break; } acc += tl[i][0]; }
      [...strip.children].forEach((el, i) => el.classList.toggle('active', i === idx));
      posEl.textContent = 'bar ' + (Math.floor(bar) + 1) + '/' + total + ' · ' + (tl[idx][1] || '');
      // the shape's words as title + subtitle (split on the em-dash) — the whole invocation shows
      const lbl = tl[idx][1] || '', dash = lbl.indexOf('—');
      wordEl.textContent = dash >= 0 ? lbl.slice(0, dash).trim() : lbl;
      subEl.textContent = dash >= 0 ? lbl.slice(dash + 1).trim() : '';
      // the typewriter: the ACTIVE line appears WORD BY WORD as it is spoken. The active line is
      // the last row at-or-before idx that fires a voice (split continuations keep typing through
      // the music change). Pacing: uniform word rate over the clip's bars, finishing a touch early
      // (~92%) since renders end in silence. The finished line stays up until the next one speaks.
      if (lyricEl && VOICE_TEXTS.length) {
        let li = null, liStart = 0, a2 = 0;
        for (let i = 0; i <= idx; i++) { if (tl[i][4] != null) { li = tl[i][4]; liStart = a2; } a2 += tl[i][0]; }
        if (li != null && VOICE_TEXTS[li] !== undefined) {
          const words = VOICE_TEXTS[li].split(' ');
          const prog = (bar - liStart) / (lineBars[li] || 4) / 0.92;
          const nw = Math.max(0, Math.min(words.length, Math.floor(words.length * prog)));
          lyricEl.textContent = nw < words.length ? words.slice(0, nw).join(' ') + ' ▍' : words.join(' ');
        } else lyricEl.textContent = '';
      }
      // the bounce is saved for the drop — a beat-phase scale pulse on the VIDEOS only (--punch);
      // the back-wall sea never bounces
      if (hasFilm) {
        const ph = (bar * 4) % 1;
        film.style.setProperty('--punch', tl[idx][2] ? String(1 + 0.16 * Math.pow(1 - ph, 3)) : '1');
      }
      syncVideo(tl, bar, !!tl[idx][2], tl[idx][3]);
      rafId = requestAnimationFrame(trackFrame);
    }
    function trackStart() {
      if (!TIMELINE.length) return;
      cachedTl = resolvedTimeline();
      trackT0 = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      if (hasFilm || hasViz) filmReset();
      trackFrame();
    }
    function trackStop() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null; posEl.textContent = '';
      if (lyricEl) lyricEl.textContent = '';
      [...strip.children].forEach(el => el.classList.remove('active'));
      if (hasFilm || hasViz) filmReset();
    }

    async function play() {
      try {
        hush(); stopVoice();
        await evaluate(editor.value);
        armVoice(resolvedTimeline());        // every line scheduled on the audio clock, up front
        setStatus('playing…'); trackStart();
      }
      catch (e) { setStatus('error: ' + (e && e.message ? e.message : e), true); }
    }
    function stop() { hush(); stopVoice(); setStatus('stopped'); trackStop(); }
    function finishLoop() { hush(); stopVoice(); trackStop(); setStatus('done · one loop — hit [ play ] again'); if (ALBUM) parent.postMessage({ cyb: 'song-done' }, '*'); }
    document.getElementById('play').addEventListener('click', play);
    document.getElementById('stop').addEventListener('click', stop);
    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); play(); }
      if ((e.ctrlKey || e.metaKey) && e.key === '.')     { e.preventDefault(); stop(); }
    });
  </script>
</body>
</html>
